name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hook-tests:
    name: hook tests (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.19.x, 22.13.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run hook tests
        run: npm test

  eslint-plugin-smoke:
    name: eslint plugin smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.x, 22.13.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify eslint plugin loads
        run: |
          cd eslint-plugin
          node -e "const p = require('./'); const rules = Object.keys(p.rules || {}); if (rules.length !== 3) { console.error('Expected 3 rules, got:', rules); process.exit(1); } console.log('Rules:', rules.join(', '));"

  bun-lint-plugin:
    name: Bun lint plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Run Bun lint plugin test
        run: npm run test:bun-lint
